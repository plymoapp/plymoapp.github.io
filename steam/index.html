  <!-- Steam's sign-in returns here (owner, 7 November): forward.js passes
       the answer on to the app's own scheme, which Plymo's sign-in sheet
       catches. A reader sees this page only if the app could not take it. -->
  <main class="shell">
    <a class="brand" href="../">
      <img src="../assets/icon-192.png" alt="" width="34" height="34">
      <span>Plymo</span>
    </a>
    <section>
      <h1>رجعت من Steam</h1>
      <p class="synopsis">ارجع إلى Plymo لإكمال ربط حسابك في Steam. إن لم يكتمل، ابدأ من جديد من «الحسابات المرتبطة» في الإعدادات.</p>
      <p class="synopsis" lang="en" dir="ltr">You're back from Steam. Return to Plymo to finish linking your Steam account; if it didn't finish, start again from “Linked accounts” in Settings.</p>
    </section>
  </main>
