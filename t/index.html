<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https://image.tmdb.org https://images.igdb.com; connect-src https://wixkzaymnbdnimaxeobl.supabase.co; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#101214">
  <title>Plymo</title>
  <meta name="description" content="تابع أفلامك ومسلسلاتك وألعابك في Plymo">
  <meta property="og:site_name" content="Plymo">
  <meta property="og:title" content="Plymo">
  <meta property="og:description" content="تابع أفلامك ومسلسلاتك وألعابك في Plymo">
  <meta property="og:image" content="https://plymoapp.github.io/assets/icon-512.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="../assets/icon-192.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="stylesheet" href="../assets/site.css">
  <script src="../assets/title.js" defer></script>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>
  <main class="shell loading" id="page">
    <a class="brand" href="../">
      <img src="../assets/icon-192.png" alt="" width="34" height="34">
      <span>Plymo</span>
    </a>

    <section id="title">
      <div class="heading">
        <div class="poster" id="poster" role="img"></div>
        <div class="words">
          <h1 id="name">&nbsp;</h1>
          <p class="facts" id="facts">&nbsp;</p>
          <span class="score" id="score" hidden>
            <img src="../assets/tmdb.svg" alt="TMDB">
            <span id="score-value"></span>
          </span>
        </div>
      </div>
      <p class="synopsis" id="synopsis"></p>
      <div class="actions">
        <a class="button primary" id="open" href="#">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11.04-6.86a1 1 0 0 0 0-1.72L9.5 4.28A1 1 0 0 0 8 5.14z"/></svg>
          <span id="open-label">افتح في Plymo</span>
        </a>
        <span class="button soon" id="soon">قريبًا على App Store</span>
      </div>
      <p class="pitch" id="pitch">Plymo يجمع أفلامك ومسلسلاتك وألعابك في مكان واحد: تتابع ما تشاهده، وتقيّمه، ويخبرك بكل حلقة جديدة.</p>
    </section>

    <section class="problem" id="problem" hidden>
      <p id="problem-text">ما قدرنا نجيب هذا العمل الحين.</p>
      <button type="button" id="retry">حاول مرة ثانية</button>
    </section>

    <footer>
      <img src="../assets/tmdb.svg" alt="TMDB">
      <span id="credit">بيانات الأفلام والمسلسلات من TMDB، وهو غير معتمد منها.</span>
    </footer>
  </main>
</body>
</html>
